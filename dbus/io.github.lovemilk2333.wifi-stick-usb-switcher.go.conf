<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.lovemilk2333.wifi-stick-usb-switcher.go"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.lovemilk2333.wifi-stick-usb-switcher.go"
           send_interface="io.github.lovemilk2333.wifi_stick_usb_switcher.go.Control"/>
    <allow receive_sender="io.github.lovemilk2333.wifi-stick-usb-switcher.go"/>
  </policy>
</busconfig>
